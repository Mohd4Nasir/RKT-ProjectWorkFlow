<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RishiKirti Projects — Enterprise Project Management</title>
    <meta name="description" content="RishiKirti Projects: plan sprints, track SLAs, manage tasks and ship faster with an enterprise-grade project management workspace." />
    <meta name="author" content="RishiKirti Inc." />

    <meta property="og:title" content="RishiKirti Projects — Enterprise Project Management" />
    <meta property="og:description" content="Plan, track and deliver projects with a beautifully designed enterprise workspace." />
    <meta property="og:type" content="website" />

    <script>
      // Apply the persisted theme BEFORE first paint, otherwise a dark-mode
      // user sees a white flash while React boots and redux-persist rehydrates.
      // Mirrors the persist key in src/store/index.ts ('rishikirti' → ui → theme).
      (function () {
        try {
          var raw = localStorage.getItem('persist:rishikirti');
          var theme = null;
          if (raw) {
            var root = JSON.parse(raw);
            // redux-persist stores each whitelisted slice as a JSON *string*,
            // so ui is a string that needs a second parse.
            var ui = typeof root.ui === 'string' ? JSON.parse(root.ui) : root.ui;
            theme = ui && ui.theme;
          }
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — fall through to the light default */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
